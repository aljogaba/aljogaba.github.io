name: Cleanup project fallback data

on:
  push:
    paths:
      - '.github/workflows/cleanup-project-fallback-data.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove migrated project collection from legacy data
        shell: python
        run: |
          from pathlib import Path

          path = Path('assets/js/content-data.js')
          text = path.read_text(encoding='utf-8')
          start_marker = '  // PROYECTOS EJECUTADOS\n'
          end_marker = '  // ASIGNATURAS IMPARTIDAS\n'
          start = text.find(start_marker)
          end = text.find(end_marker)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Could not locate project fallback block safely')

          replacement = (
              '  // PROYECTOS\n'
              '  // Migrados a assets/js/canonical-data.js desde la fuente canónica.\n'
              '  // No mantener una segunda copia manual en este archivo.\n\n'
          )
          cleaned = text[:start] + replacement + text[end:]
          if 'projects:' in cleaned:
              raise SystemExit('Legacy projects property still present after cleanup')
          if 'teaching:' not in cleaned or 'talks:' not in cleaned:
              raise SystemExit('Unexpected damage to neighboring collections')
          path.write_text(cleaned, encoding='utf-8')

      - name: Validate JavaScript
        run: node --check assets/js/content-data.js

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/content-data.js
          git commit -m 'Remove migrated project fallback data'
          git push
