name: Cleanup shared header

on:
  push:
    paths:
      - '.github/workflows/cleanup-shared-header.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove duplicated brand role from HTML
        shell: python
        run: |
          from pathlib import Path
          import re

          pattern = re.compile(r'\s*<span\s+class="brand-role"\s*>.*?</span>', re.S)
          changed = []

          for path in sorted(Path('.').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              cleaned, count = pattern.subn('', text)
              if count:
                  path.write_text(cleaned, encoding='utf-8')
                  changed.append(f'{path}: {count}')

          print('Cleaned files:')
          for item in changed:
              print(f'  {item}')

          remaining = []
          for path in sorted(Path('.').glob('*.html')):
              if 'brand-role' in path.read_text(encoding='utf-8'):
                  remaining.append(str(path))

          if remaining:
              raise SystemExit('brand-role still present in HTML: ' + ', '.join(remaining))

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet -- '*.html'; then
            echo 'No HTML cleanup needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          git commit -m 'Remove duplicated brand tagline from HTML'
          git push
