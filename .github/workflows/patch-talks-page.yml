name: Patch talks page

on:
  push:
    paths:
      - '.github/workflows/patch-talks-page.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean and restructure talks pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          main_es = "\n".join([
              '    <main id="main-content">',
              '      <section class="page-hero">',
              '        <div class="container reveal">',
              '          <p class="eyebrow">COMUNICACIÓN CIENTÍFICA</p>',
              '          <h1>Ponencias y contribuciones en congresos</h1>',
              '          <p class="page-intro">',
              '            Selección de ponencias invitadas y magistrales, junto con contribuciones científicas publicadas en memorias de congresos y sus recursos de consulta cuando están disponibles.',
              '          </p>',
              '        </div>',
              '      </section>',
              '      <section class="section">',
              '        <div class="container content-stack">',
              '          <section class="content-block">',
              '            <h2>Ponencias invitadas y magistrales</h2>',
              '            <div data-collection="talks" data-category="invited" data-filter-mode="year">',
              '              <div class="filter-bar" data-filters></div>',
              '              <div data-fallback><p>Las ponencias seleccionadas se cargan desde la fuente profesional canónica.</p></div>',
              '              <div data-dynamic hidden></div>',
              '            </div>',
              '          </section>',
              '          <section class="content-block">',
              '            <h2>Contribuciones en congresos</h2>',
              '            <div data-collection="talks" data-category="conference" data-filter-mode="year">',
              '              <div class="filter-bar" data-filters></div>',
              '              <div data-fallback><p>Las contribuciones publicadas se cargan desde la bibliografía canónica y sus recursos asociados.</p></div>',
              '              <div data-dynamic hidden></div>',
              '            </div>',
              '          </section>',
              '        </div>',
              '      </section>',
              '    </main>',
          ])

          main_en = "\n".join([
              '    <main id="main-content">',
              '      <section class="page-hero">',
              '        <div class="container reveal">',
              '          <p class="eyebrow">SCIENTIFIC COMMUNICATION</p>',
              '          <h1>Talks &amp; conference contributions</h1>',
              '          <p class="page-intro">',
              '            Selected invited and keynote talks, together with scientific contributions published in conference proceedings and access to supporting resources when available.',
              '          </p>',
              '        </div>',
              '      </section>',
              '      <section class="section">',
              '        <div class="container content-stack">',
              '          <section class="content-block">',
              '            <h2>Invited and keynote talks</h2>',
              '            <div data-collection="talks" data-category="invited" data-filter-mode="year">',
              '              <div class="filter-bar" data-filters></div>',
              '              <div data-fallback><p>Selected talks are loaded from the canonical professional source.</p></div>',
              '              <div data-dynamic hidden></div>',
              '            </div>',
              '          </section>',
              '          <section class="content-block">',
              '            <h2>Conference contributions</h2>',
              '            <div data-collection="talks" data-category="conference" data-filter-mode="year">',
              '              <div class="filter-bar" data-filters></div>',
              '              <div data-fallback><p>Published conference contributions are loaded from the canonical bibliography and their associated resources.</p></div>',
              '              <div data-dynamic hidden></div>',
              '            </div>',
              '          </section>',
              '        </div>',
              '      </section>',
              '    </main>',
          ])

          pages = {
              'talks-es.html': (
                  'Contribuciones en congresos y ponencias invitadas de Alberto Jorge Galindo-Barboza sobre salud porcina, PRRSV, PCV2, influenza, epidemiología molecular y sistemas de producción.',
                  'Ponencias invitadas y magistrales, y contribuciones científicas publicadas en memorias de congresos de Alberto Jorge Galindo-Barboza.',
                  main_es,
              ),
              'talks.html': (
                  'Peer-reviewed conference contributions and invited talks by Alberto Jorge Galindo-Barboza on swine health, PRRSV, PCV2, influenza, molecular epidemiology, and production systems.',
                  'Selected invited and keynote talks, together with scientific contributions published in conference proceedings by Alberto Jorge Galindo-Barboza.',
                  main_en,
              ),
          }

          for filename, (old_desc, new_desc, main) in pages.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text = text.replace(old_desc, new_desc)
              text, n = re.subn(r'    <main id="main-content">.*?    </main>', main, text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'Could not replace main content in {filename}')
              path.write_text(text, encoding='utf-8')

          path = Path('assets/js/content-data.js')
          text = path.read_text(encoding='utf-8')
          replacement = (
              '  // ==========================================================\n'
              '  // PONENCIAS Y CONTRIBUCIONES EN CONGRESOS\n'
              '  // Migradas a assets/js/canonical-data.js desde la fuente canónica.\n'
              '  // Ponencias invitadas/magistrales: data/ponencias.yml + web/selection.yml.\n'
              '  // Contribuciones en congresos: bibliografía canónica + web/resources.yml.\n'
              '  // No mantener una segunda copia manual en este archivo.\n\n'
              '  // ==========================================================\n'
              '  // PROYECTOS'
          )
          text, n = re.subn(r'  // PONENCIAS Y CONGRESOS.*?\n  // PROYECTOS', replacement, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not remove legacy talks collection from content-data.js')
          path.write_text(text, encoding='utf-8')

          content = Path('assets/js/content-data.js').read_text(encoding='utf-8')
          if re.search(r'\btalks\s*:\s*\[', content):
              raise SystemExit('Legacy talks array still present')
          for filename in pages:
              txt = Path(filename).read_text(encoding='utf-8')
              if 'data-category="invited"' not in txt or 'data-category="conference"' not in txt:
                  raise SystemExit(f'Missing talks category container in {filename}')
          print('Talks pages cleaned and restructured.')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add talks-es.html talks.html assets/js/content-data.js
          git commit -m 'Separate invited talks from conference contributions'
          git push
